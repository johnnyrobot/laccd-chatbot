syntax = "proto3";

package com.laccd.chatbot.proto;

option java_package = "com.laccd.chatbot.proto";
option java_multiple_files = true;

enum Theme {
  THEME_UNSPECIFIED = 0;

  // Force to use light theme.
  THEME_LIGHT = 1;

  // Force to use dark theme.
  THEME_DARK = 2;

  // Use the system them setting on user's phone.
  THEME_AUTO = 3;
}

message ImportedModel {
  string file_name = 1;
  int64 file_size = 2;

  oneof config {
    LlmConfig llm_config = 3;
  }
}

message LlmConfig {
  repeated string compatible_accelerators = 1;
  int32 default_max_tokens = 2;
  int32 default_topk = 3;
  float default_topp = 4;
  float default_temperature = 5;
  bool support_image = 6;
  bool support_audio = 7;
  reserved 8, 9;
  bool support_thinking = 10;
  bool support_speculative_decoding = 11;
}

message Settings {
  Theme theme = 1;
  reserved 2, 6, 8;
  repeated string text_input_history = 3;
  repeated ImportedModel imported_model = 4;
  // Has the app tos been accepted.
  bool is_tos_accepted = 5;
  bool has_seen_benchmark_comparison_help = 7;
  // copybara:strip_begin(google-internal)
  // Feature flags
  map<string, bool> feature_flags = 9;
  // copybara:strip_end

  repeated string viewed_promo_id = 10;

  // UI language preference (mirrors Theme's auto/explicit pattern).
  LanguagePreference language = 11;

  // selected campus code (e.g. "LAMC"). Empty/missing means the user
  // has not yet picked a campus and the first-run picker should be shown. Drives per-campus
  // theming, system prompt voice, and which knowledge pack is loaded.
  string selected_campus_code = 12;
}

// UI language override.
enum LanguagePreference {
  // Treated the same as LANGUAGE_AUTO (proto3 default zero value).
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_EN = 1;
  LANGUAGE_ES = 2;
  // Use the system locale.
  LANGUAGE_AUTO = 3;
}

message UserData {
  map<string, string> custom_system_prompts = 1;
}

// local-only student profile. Never sent to the network;
// only injected into on-device prompts via the chat composer's autofill chips.
message Profile {
  string student_id = 1;
  string student_email = 2;
}
